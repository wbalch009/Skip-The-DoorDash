<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Recipe Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="food-deco left-deco" aria-hidden="true">
  <span style="--d:0s;   --x:20px">🍋</span>
  <span style="--d:1.2s; --x:10px">🌿</span>
  <span style="--d:2.4s; --x:25px">🧄</span>
  <span style="--d:0.8s; --x:5px" >🌶️</span>
  <span style="--d:3.1s; --x:18px">🥑</span>
  <span style="--d:1.8s; --x:12px">🫑</span>
  <span style="--d:2.9s; --x:8px" >🍊</span>
  <span style="--d:0.4s; --x:22px">🧅</span>
  <span style="--d:3.5s; --x:15px">🌿</span>
  <span style="--d:1.5s; --x:6px" >🍋</span>
</div>

<div class="food-deco right-deco" aria-hidden="true">
  <span style="--d:0.6s; --x:18px">🫙</span>
  <span style="--d:1.9s; --x:8px" >🧂</span>
  <span style="--d:2.2s; --x:20px">🥚</span>
  <span style="--d:0.3s; --x:12px">🫒</span>
  <span style="--d:3.3s; --x:25px">🥗</span>
  <span style="--d:1.1s; --x:6px" >🍅</span>
  <span style="--d:2.7s; --x:16px">🧀</span>
  <span style="--d:0.9s; --x:10px">🥦</span>
  <span style="--d:3.8s; --x:22px">🌿</span>
  <span style="--d:1.6s; --x:4px" >🫑</span>
</div>
  <header class="site-header">
    <h1>&#127860; Skip The DoorDash &#128298;</h1>
    <span class="header-meta" id="header-meta">Loading...</span>
  </header>

  <main class="container">

    <div class="controls">
      <div class="filter-row" id="filter-row">
        <button class="filter-btn active" data-filter="all">All recipes</button>
        <button class="filter-btn" data-filter="fav">&#9733; Favorites</button>
        <button class="filter-btn" data-filter="chicken">&#127831; Chicken</button>
        <button class="filter-btn" data-filter="beef">&#x1F969; Beef</button>
        <button class="filter-btn" data-filter="fish">&#128031; Fish</button>
        <button class="filter-btn" data-filter="vegetarian">&#129367; Vegetarian</button>
        <button class="filter-btn" data-filter="snack">&#127807; Snacks</button>
        <button class="filter-btn" data-filter="dessert">&#127874; Sweet Treats</button>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="search" type="text" placeholder="Search by name, ingredient, tag..." />
      </div>
    </div>

    <div class="count-line" id="count-line"></div>
    <div id="recipe-output"></div>

  </main>

  <script src="js/recipes.js" defer></script>

</body>
</html>
